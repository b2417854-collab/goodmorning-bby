<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Morning Bby ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg, #ffd6e7, #fff4c7, #ffe5ec);
  background-size:200% 200%;
  display:flex;
  justify-content:center;
  align-items:center;
  animation:gradientShift 8s ease infinite;
}

@keyframes gradientShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.sun{
  position:absolute;
  top:12%;
  width:120px;
  height:120px;
  border-radius:50%;
  background:#ffd54f;
  box-shadow:0 0 45px #ffb300, 0 0 80px rgba(255, 179, 0, 0.4);
  animation:sunrise 4s infinite alternate, sunGlow 3s ease-in-out infinite;
}

@keyframes sunrise{
  from{transform:translateY(30px)}
  to{transform:translateY(-20px)}
}

@keyframes sunGlow{
  0%{box-shadow:0 0 45px #ffb300, 0 0 80px rgba(255, 179, 0, 0.4)}
  50%{box-shadow:0 0 60px #ffb300, 0 0 120px rgba(255, 179, 0, 0.7)}
  100%{box-shadow:0 0 45px #ffb300, 0 0 80px rgba(255, 179, 0, 0.4)}
}

.cloud{
  position:absolute;
  width:130px;
  height:40px;
  background:white;
  border-radius:50px;
  opacity:.8;
  animation:move 15s linear infinite;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:55px;height:55px;
  left:20px;top:-25px;
}

.cloud:after{
  width:65px;height:65px;
  right:15px;top:-35px;
}

.c1{top:18%;left:-150px;animation:move 15s linear infinite}
.c2{top:30%;left:-250px;animation:move 18s linear infinite 4s}

@keyframes move{
  to{left:110%}
}

.card{
  position:relative;
  z-index:5;
  width:88%;
  max-width:380px;
  padding:35px 22px;
  text-align:center;
  border-radius:30px;
  background:rgba(255,255,255,.85);
  box-shadow:0 10px 35px rgba(0,0,0,.15), 0 0 40px rgba(255, 105, 180, 0.2);
  backdrop-filter:blur(8px);
  animation:cardPulse 4s ease-in-out infinite;
  border:2px solid rgba(255, 105, 180, 0.1);
}

@keyframes cardPulse{
  0%{transform:scale(1);box-shadow:0 10px 35px rgba(0,0,0,.15), 0 0 40px rgba(255, 105, 180, 0.2)}
  50%{transform:scale(1.02);box-shadow:0 10px 35px rgba(0,0,0,.2), 0 0 60px rgba(255, 105, 180, 0.4)}
  100%{transform:scale(1);box-shadow:0 10px 35px rgba(0,0,0,.15), 0 0 40px rgba(255, 105, 180, 0.2)}
}

.emoji-top{
  font-size:55px;
  animation:emojiWave 2s ease-in-out infinite;
  display:inline-block;
}

@keyframes emojiWave{
  0%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-10px) rotate(5deg)}
  50%{transform:translateY(0) rotate(0deg)}
  75%{transform:translateY(-10px) rotate(-5deg)}
  100%{transform:translateY(0) rotate(0deg)}
}

.flower{
  display:inline-block;
  animation:flowerSpin 3s linear infinite;
}

@keyframes flowerSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

h1{
  color:#ff4f81;
  font-size:35px;
  margin:10px 0;
  animation:textGlow 2.5s ease-in-out infinite;
  text-shadow:0 0 10px rgba(255, 79, 129, 0.3);
}

@keyframes textGlow{
  0%{text-shadow:0 0 10px rgba(255, 79, 129, 0.3), 0 0 20px rgba(255, 79, 129, 0)}
  50%{text-shadow:0 0 15px rgba(255, 79, 129, 0.6), 0 0 30px rgba(255, 79, 129, 0.4)}
  100%{text-shadow:0 0 10px rgba(255, 79, 129, 0.3), 0 0 20px rgba(255, 79, 129, 0)}
}

p{
  color:#7a4055;
  font-size:18px;
  line-height:1.6;
  animation:fadeInUp .8s ease;
}

button{
  border:0;
  padding:14px 25px;
  border-radius:30px;
  background:#ff5f8f;
  color:white;
  font-size:17px;
  cursor:pointer;
  transition:all .3s ease;
  animation:buttonBounce 2s ease-in-out infinite;
  box-shadow:0 4px 15px rgba(255, 95, 143, 0.4);
}

button:hover{
  background:#ff3d6f;
  transform:scale(1.05);
  box-shadow:0 6px 20px rgba(255, 95, 143, 0.6);
}

button:active{
  transform:scale(0.98);
}

@keyframes buttonBounce{
  0%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
  100%{transform:translateY(0)}
}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

#message{
  display:none;
  margin-top:20px;
  animation:pop .7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes pop{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}

#message p{
  animation:slideInDown 1s ease;
}

@keyframes slideInDown{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}

.heart{
  position:absolute;
  bottom:-30px;
  font-size:25px;
  animation:float 6s linear infinite;
  filter:drop-shadow(0 2px 4px rgba(255, 79, 129, 0.3));
}

@keyframes float{
  0%{transform:translateY(0) rotate(0) scale(1);opacity:1}
  50%{transform:translateY(-50vh) rotate(180deg) scale(1.2)}
  100%{transform:translateY(-110vh) rotate(360deg) scale(0);opacity:0}
}

.h1{left:10%;animation-delay:0s}
.h2{left:30%;animation-delay:1.5s}
.h3{left:55%;animation-delay:3s}
.h4{left:80%;animation-delay:4.5s}

.sparkle{
  position:absolute;
  pointer-events:none;
  font-size:12px;
  animation:sparkleFloat 1.5s ease-out forwards;
}

@keyframes sparkleFloat{
  0%{opacity:1;transform:translate(0, 0)}
  100%{opacity:0;transform:translate(var(--tx), var(--ty))}
}
</style>
</head>

<body>

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="card">
  <div class="emoji-top">
    <span class="flower">🌸</span>🌅🦋
  </div>

  <h1>Good Morning Bby ❤️</h1>

  <p>
    Good morning mere bby 🥰<br>
    Tumhari smile meri morning ko aur bhi beautiful bana deti hai 💕
  </p>

  <button onclick="showMessage()">💌 Tap Here</button>

  <div id="message">
    <p>
      ❤️ Bas itna kehna hai...<br>
      Apna khayal rakhna,<br>
      khush rehna aur aaj bhi<br>
      ek beautiful smile zaroor dena 😘🌸<br><br>
      <b>Have a lovely day, Bby 💖</b>
    </p>
  </div>
</div>

<div class="heart h1">❤️</div>
<div class="heart h2">💗</div>
<div class="heart h3">💕</div>
<div class="heart h4">💖</div>

<script>
function showMessage(){
  const messageDiv = document.getElementById("message");
  messageDiv.style.display="block";
  createSparkles(event.clientX, event.clientY);
}

function createSparkles(x, y){
  const sparkles = ['✨', '💫', '⭐', '🌟'];
  for(let i = 0; i < 8; i++){
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
    sparkle.style.left = x + 'px';
    sparkle.style.top = y + 'px';
    
    const angle = (Math.PI * 2 * i) / 8;
    const distance = 80;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;
    sparkle.style.setProperty('--tx', tx + 'px');
    sparkle.style.setProperty('--ty', ty + 'px');
    
    document.body.appendChild(sparkle);
    
    setTimeout(() => sparkle.remove(), 1500);
  }
}
</script>

</body>
</html>
